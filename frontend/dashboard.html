<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceAI</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header class="topbar">
    <a class="logo-box logo-home-link" href="./index.html" aria-label="FinanceAI 홈페이지로 이동">
      <span class="brand-symbol" aria-hidden="true">
        <img src="./assets/financeai-logo.png" alt="" width="1254" height="1254">
      </span>
      <span class="brand-name">Finance<span class="brand-accent">AI</span></span>
    </a>

    <div class="user-box">
      <span id="header-user-name">사용자</span>
<span id="header-user-age">-세</span>
    </div>
  </header>


  <main class="container">
    <nav class="page-navigation" aria-label="페이지 이동">
      <button class="navigation-button" type="button" data-back-fallback="./index.html">← 이전 화면</button>
      <a class="navigation-button" href="./index.html">홈페이지</a>
    </nav>

    <!-- 금융 위험도 -->
    <section class="risk-card">

      <div class="risk-info">
        <p class="card-title">이번달 거래 평균 위험점수</p>

        <div class="risk-score-box">
          <span id="riskScore">-</span>
          <span class="score-total">/ 100</span>
        </div>

        <span id="riskLevel" class="transaction-status unavailable">
          불러오는 중
        </span>
      </div>


      <div class="risk-message">

        <h2>거래 정보를 불러오는 중입니다.</h2>

        <p>
          잠시만 기다려주세요.
        </p>

        <button id="detailButton" disabled>
          최근 거래 분석 확인
        </button>

      </div>

    </section>


    <!-- 오늘 금융 현황 -->
    <section class="summary-grid">

      <article class="summary-card">
        <p>오늘 결제 금액</p>
        <strong id="todayAmount">
          -
        </strong>
      </article>


      <article class="summary-card">
        <p>오늘 결제 횟수</p>
        <strong id="todayCount">
          -
        </strong>
      </article>


      <article class="summary-card">
        <p>전체 기간 이상행동 탐지</p>
        <strong id="alertCount">
          -
        </strong>
      </article>

    </section>


    <!-- 최근 이상행동 -->
    <section class="content-card">

      <div class="section-header">

        <div>
          <h2>최근 이상행동</h2>
          <p>
            금융 이상행동 탐지 시스템이 감지한 결과입니다.
          </p>
        </div>

        <button
  class="text-button"
  onclick="location.href='./transactions.html'"
>
  전체보기
</button>

      </div>

      <div id="alertList" class="alert-list">

        <p class="empty-state">불러오는 중입니다.</p>

      </div>

    </section>


    <!-- 최근 거래내역 -->
    <section class="content-card">

      <div class="section-header">

        <div>
          <h2>최근 거래내역</h2>
          <p>
            최근 거래를 최신순으로 표시합니다.
          </p>
        </div>

        <a class="text-button" href="./transactions.html">전체보기</a>

      </div>

      <div id="transactionList" class="transaction-list">

        <p class="empty-state">불러오는 중입니다.</p>

      </div>

    </section>

  </main>


  <script src="./js/common.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/user-header.js"></script>

</body>
</html>
