<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceAI - 로그인</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">

      <a class="login-logo logo-home-link" href="./index.html" aria-label="FinanceAI 홈페이지로 이동">
        <span class="brand-symbol" aria-hidden="true">
          <img src="./assets/financeai-logo.png" alt="" width="1254" height="1254">
        </span>
        <span class="brand-name">Finance<span class="brand-accent">AI</span></span>
      </a>

      <h1>로그인</h1>

      <p class="login-description">
        개인별 금융 위험도와 이상행동 분석 결과를 확인하세요.
      </p>


      <form id="loginForm">

        <div class="form-group">
          <label for="userId">아이디</label>

          <input
            type="text"
            id="userId"
            autocomplete="username"
            placeholder="아이디를 입력하세요"
            required
          >
        </div>


        <div class="form-group">
          <label for="password">비밀번호</label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="비밀번호를 입력하세요"
            required
          >
        </div>


        <button type="submit" class="login-submit">
          로그인
        </button>

        <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>

      <div class="login-help">
  계정이 없으신가요?
  <a href="./signup.html">
    회원가입
  </a>
</div>

<div class="login-help">
  <a href="./index.html">
    ← 홈페이지로 돌아가기
  </a>
</div>

    </section>

  </main>


  <script src="./js/common.js"></script>
<script src="./js/auth.js"></script>

</body>
</html>
