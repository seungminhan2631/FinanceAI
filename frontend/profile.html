<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FinanceAI - 회원정보</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header class="topbar">

    <a class="logo-box logo-home-link" href="./index.html" aria-label="FinanceAI 홈페이지로 이동">
      <span class="brand-symbol" aria-hidden="true">
        <img src="./assets/financeai-logo.png" alt="" width="1254" height="1254">
      </span>
      <span class="brand-name">Finance<span class="brand-accent">AI</span></span>
    </a>

    <div class="user-box">
      <span id="header-user-name">사용자</span>
<span id="header-user-age">-세</span>
    </div>

  </header>


  <main class="container">

    <button
      class="back-button"
      onclick="location.href='./index.html'"
    >
      ← 홈페이지로 돌아가기
    </button>


    <section class="profile-page-header">

      <div>
        <p class="page-label">
          PROFILE
        </p>

        <h1>회원정보</h1>

        <p>
          로그인한 계정의 기본 정보를 확인합니다.
        </p>
      </div>

    </section>


    <section class="profile-layout">

      <aside class="profile-side-card">

        <div class="profile-large-avatar">
          -
        </div>

        <h2 id="profileDisplayName">
  사용자
</h2>

<p id="profileDisplayId"></p>

        <span class="profile-user-badge">
          회원
        </span>

      </aside>


      <section class="profile-main-card">

        <div class="profile-section-title">

          <div>
            <h2>기본 정보</h2>

            <p>
              회원가입 시 등록한 정보입니다.
            </p>
          </div>

          <p class="feature-note">회원정보 수정은 아직 지원하지 않습니다.</p>

        </div>


        <div class="profile-form-grid">

          <div class="profile-form-group">

            <label>
              이름
            </label>

            <input
  id="profileName"
  type="text"
  value=""
  disabled
>

          </div>


          <div class="profile-form-group">

            <label>
              생년월일
            </label>

            <input
              id="profileBirth"
              type="text"
              value=""
              disabled
            >

          </div>


          <div class="profile-form-group">

            <label>
              아이디
            </label>

            <input
              id="profileId"
              type="text"
              value=""
              disabled
            >

          </div>


          <div class="profile-form-group">

            <label>
              휴대폰 번호
            </label>

            <input
              id="profilePhone"
              type="text"
              value=""
              disabled
            >

          </div>


          <div class="profile-form-group">

            <label>
              거주 지역
            </label>

            <input
              id="profileRegion"
              type="text"
              value=""
              disabled
            >

          </div>


          <div class="profile-form-group">

            <label>
              보호자 연락처
            </label>

            <input
              id="guardianPhone"
              type="text"
              value=""
              disabled
            >

          </div>

        </div>




      </section>

    </section>

  </main>


  <script src="./js/common.js"></script>
<script src="./js/profile.js"></script>

<script src="./js/user-header.js"></script>

</body>
</html>
