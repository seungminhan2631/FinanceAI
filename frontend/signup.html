<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceAI - 회원가입</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card signup-card">

      <a class="login-logo logo-home-link" href="./index.html" aria-label="FinanceAI 홈페이지로 이동">
        <span class="brand-symbol" aria-hidden="true">
          <img src="./assets/financeai-logo.png" alt="" width="1254" height="1254">
        </span>
        <span class="brand-name">Finance<span class="brand-accent">AI</span></span>
      </a>

      <h1>회원가입</h1>

      <p class="login-description">
        자녀의 금융 이상행동을 확인하기 위한 기본 정보를 입력해주세요.
      </p>

      <form id="signupForm">

        <div class="form-group">
          <label for="name">이름</label>

          <input
            type="text"
            id="name"
            placeholder="이름을 입력하세요"
            required
          >
        </div>

        <div class="form-group">
          <label for="birthDate">생년월일</label>

          <input
            type="date"
            id="birthDate"
            required
          >
        </div>

        <div class="form-group">
          <label for="signupId">아이디</label>

          <input
            type="text"
            id="signupId"
            autocomplete="username"
            placeholder="사용할 아이디를 입력하세요"
            required
          >
        </div>

        <div class="form-group">
          <label for="signupPassword">비밀번호</label>

          <input
            type="password"
            id="signupPassword"
            autocomplete="new-password"
            placeholder="비밀번호를 입력하세요"
            required
          >
        </div>

        <div class="form-group">
          <label for="passwordConfirm">비밀번호 확인</label>

          <input
            type="password"
            id="passwordConfirm"
            autocomplete="new-password"
            placeholder="비밀번호를 다시 입력하세요"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">휴대폰 번호</label>

          <input
            type="tel"
            id="phone"
            placeholder="010-0000-0000"
            required
          >
        </div>

        <div class="terms-box">
          <label>
            <input type="checkbox" id="terms" required>
            개인정보 수집 및 서비스 이용에 동의합니다.
          </label>
        </div>

        <button type="submit" class="login-submit">
          회원가입
        </button>

        <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>

      <div class="login-help">
        이미 계정이 있으신가요?
        <a href="./login.html">
          로그인
        </a>
      </div>

    </section>

  </main>

  <script src="./js/common.js"></script>
<script src="./js/auth.js"></script>

</body>
</html>
