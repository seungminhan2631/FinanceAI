<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceAI - 거래내역</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header class="topbar">

    <a class="logo-box logo-home-link" href="./index.html" aria-label="FinanceAI 홈페이지로 이동">
      <span class="brand-symbol" aria-hidden="true">
        <img src="./assets/financeai-logo.png" alt="" width="1254" height="1254">
      </span>
      <span class="brand-name">Finance<span class="brand-accent">AI</span></span>
    </a>

    <div class="user-box">
      <span id="header-user-name">사용자</span>
<span id="header-user-age">-세</span>
    </div>

  </header>


  <main class="container">
    <nav class="page-navigation" aria-label="페이지 이동">
      <button class="navigation-button" type="button" data-back-fallback="./dashboard.html">← 이전 화면</button>
      <a class="navigation-button" href="./index.html">홈페이지</a>
    </nav>

    <div class="page-top">

      <div>
        <p class="page-label">TRANSACTIONS</p>
        <h1>거래내역</h1>
        <p class="page-description">
          최근 결제 내역과 이상행동 탐지 결과를 확인할 수 있습니다.
        </p>
      </div>

      <button
        class="back-dashboard-button"
        onclick="location.href='./dashboard.html'"
      >
        대시보드로 돌아가기
      </button>

    </div>


    <section class="transaction-summary-grid">

      <article class="transaction-summary-card">
        <p>오늘 결제 금액</p>
        <strong id="todayAmount">-</strong>
      </article>

      <article class="transaction-summary-card">
        <p>오늘 결제 횟수</p>
        <strong id="todayCount">-</strong>
      </article>

      <article class="transaction-summary-card">
        <p>이번달 이상행동 탐지</p>
        <strong id="detectedCount">-</strong>
      </article>

    </section>


    <section class="content-card">

      <div class="transaction-filter">

        <div>
          <h2>전체 거래</h2>
          <p>전체 거래를 최신순으로 표시합니다.</p>
        </div>


        <div class="filter-buttons">

          <button class="filter-button active" data-filter="all" aria-pressed="true" disabled>
            전체
          </button>

          <button class="filter-button" data-filter="normal" aria-pressed="false" disabled>
            정상
          </button>

          <button class="filter-button" data-filter="warning" aria-pressed="false" disabled>
            주의
          </button>

          <button class="filter-button" data-filter="danger" aria-pressed="false" disabled>
            위험
          </button>

          <button class="filter-button" data-filter="monitor" aria-pressed="false" disabled>관찰</button>
          <button class="filter-button" data-filter="unavailable" aria-pressed="false" disabled>분석 불가</button>
        </div>

      </div>


      <div class="transaction-table-header">

        <span>거래정보</span>
        <span>결제시간</span>
        <span>금액</span>
        <span>상태</span>

      </div>


      <div class="full-transaction-list"><p class="empty-state">불러오는 중입니다.</p></div>

    </section>

  </main>

  <script src="./js/common.js"></script>
  <script src="./js/transactions.js"></script>
  <script src="./js/user-header.js"></script>
  
</body>
</html>
